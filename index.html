<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Nimiq TipJar</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#1a1a2e;color:#eee;min-height:100vh;display:flex;align-items:center;justify-content:center}#app{background:#16213e;border-radius:16px;padding:32px;max-width:400px;width:90%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.3)}h1{color:#f5a623;margin-bottom:8px;font-size:28px}.sub{color:#888;margin-bottom:24px;font-size:14px}#status{color:#aaa;font-size:13px;margin-bottom:16px;min-height:20px}input[type=number]{width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#0f3460;color:#fff;font-size:18px;text-align:center;margin-bottom:12px}button{width:100%;padding:14px;border-radius:8px;border:none;background:#f5a623;color:#1a1a2e;font-size:16px;font-weight:bold;cursor:pointer}button:disabled{opacity:0.4;cursor:not-allowed}#result{margin-top:16px;font-size:13px;color:#4ade80;min-height:20px;word-break:break-all}.acc{font-size:11px;color:#666;margin-top:8px;word-break:break-all}</style></head><body><div id=app><h1>TipJar</h1><p class=sub>Micro-tipping powered by NIM</p><div id=status>Connecting...</div><input type=number id=amount placeholder=Amount in NIM min=0.001 step=0.001 value=0.01><button id=tipBtn disabled>Send Tip</button><div id=result></div><div class=acc id=account></div></div><script type=module src=/src/main.js></script></body></html>
